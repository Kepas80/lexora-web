<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Confirmar suscripción · Lexora</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; background:#f1f5f9; color:#0f172a;
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .envoltorio { max-width:520px; margin:0 auto; padding:48px 20px; }
  .tarjeta { background:#fff; border-radius:16px; padding:40px 32px; text-align:center;
             box-shadow:0 1px 3px rgba(15,23,42,.06); }
  .icono { width:48px; height:48px; border-radius:12px; margin-bottom:20px; }
  h1 { margin:0 0 14px; font-size:22px; line-height:1.3; }
  p { margin:0 0 12px; font-size:15px; line-height:1.7; color:#475569; }
  .pequeno { font-size:13px; color:#94a3b8; }
  .boton { display:inline-block; background:#367DF9; color:#fff; border:0; font-size:15px;
           font-weight:600; padding:14px 32px; border-radius:12px; cursor:pointer;
           margin-top:24px; text-decoration:none; }
  .pie { text-align:center; margin-top:20px; }
  .pie a { color:#94a3b8; font-size:13px; text-decoration:none; }
</style>
</head>
<body>
<div class="envoltorio">
  <div class="tarjeta">
    <img class="icono" src="https://www.lexoraflashcards.com/icon-512.png" alt="Lexora">
    <div id="contenido"><p>Un momento…</p></div>
  </div>
  <p class="pie"><a href="https://www.lexoraflashcards.com">lexoraflashcards.com</a></p>
</div>

<script>
/*
 * CONFIRMACIÓN DE SUSCRIPCIÓN (doble opt-in)
 *
 * Igual que baja-comunicaciones.html, y por los mismos dos motivos:
 *
 * 1. La página vive en nuestro dominio porque Supabase reescribe el
 *    Content-Type de text/html a text/plain en *.supabase.co. Una función que
 *    devuelve HTML se ve como código fuente en pantalla.
 *
 * 2. Se confirma en DOS pasos, con un clic explícito. Los antivirus de correo
 *    abren los enlaces automáticamente: si bastara con abrir la página,
 *    estaríamos dando por confirmadas altas que en realidad hizo un robot. Y un
 *    consentimiento que dio un robot no vale nada, ni legal ni prácticamente.
 */
(function () {
  var API = 'https://cnaryvdbvvouxzlqlcuh.supabase.co/functions/v1/suscribir-blog';
  var caja = document.getElementById('contenido');
  var token = (new URLSearchParams(window.location.search).get('t') || '').trim();

  function pintar(h) { caja.innerHTML = h; }

  if (!token) {
    pintar('<h1>Enlace incompleto</h1><p>Este enlace no lleva el identificador necesario. ' +
           'Ábrelo desde el correo que recibiste, o escríbenos a ' +
           '<a href="mailto:hola@lexoraflashcards.com">hola@lexoraflashcards.com</a>.</p>');
    return;
  }

  pintar('<h1>¿Confirmas tu suscripción?</h1>' +
         '<p>Pulsa el botón y empezarás a recibir los trucos de memoria de Lexora.</p>' +
         '<button class="boton" id="confirmar">Sí, confirmo</button>' +
         '<p class="pequeno" style="margin-top:18px;">Si has llegado aquí por error, cierra ' +
         'esta página: no se ha apuntado a nadie.</p>');

  document.getElementById('confirmar').addEventListener('click', function () {
    var b = this; b.disabled = true; b.textContent = 'Un momento…';
    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) throw new Error('error');
        pintar('<h1>Listo, ya estás dentro</h1>' +
               '<p>Hemos confirmado <b>' + (d.email || 'tu dirección') + '</b>.</p>' +
               '<p class="pequeno">Te puedes dar de baja de un clic en el pie de cualquier correo.</p>' +
               '<a class="boton" href="https://dashboard.lexoraflashcards.com?utm_source=web&utm_medium=confirmacion&utm_campaign=popup_blog">Probar Lexora gratis</a>');
      })
      .catch(function () {
        pintar('<h1>No hemos podido confirmarlo</h1><p>El enlace no es válido o ha caducado. ' +
               'Escríbenos a <a href="mailto:hola@lexoraflashcards.com">hola@lexoraflashcards.com</a> ' +
               'y lo hacemos a mano.</p>');
      });
  });
})();
</script>
</body>
</html>
